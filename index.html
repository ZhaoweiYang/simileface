<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmileFace - AI Smile Video Generator</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script src="gif-encoder.js"></script>
</head>
<body>
    <div class="container">
        <h1>😊 SmileFace</h1>
        <p class="subtitle">Upload a face photo, generate a smiling loop video</p>

        <div id="upload-area" class="upload-area">
            <input type="file" id="file-input" accept="image/*" hidden>
            <div class="upload-placeholder" id="upload-placeholder">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="17 8 12 3 7 8"/>
                    <line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
                <span>Click or drag to upload a face photo</span>
            </div>
            <img id="preview-img" class="preview-img" hidden>
        </div>

        <div id="controls" class="controls" hidden>
            <div class="slider-group">
                <label for="intensity-slider">Smile Intensity</label>
                <input type="range" id="intensity-slider" min="5" max="40" value="18" step="1">
                <span id="intensity-value">18</span>
            </div>
            <div class="slider-group">
                <label for="speed-slider">Animation Speed (ms/frame)</label>
                <input type="range" id="speed-slider" min="50" max="300" value="120" step="10">
                <span id="speed-value">120</span>
            </div>
            <button id="generate-btn" class="btn btn-primary">Generate Smile Animation</button>
        </div>

        <div id="status" class="status" hidden></div>
        <div id="progress-bar-container" class="progress-bar-container" hidden>
            <div id="progress-bar" class="progress-bar"></div>
        </div>

        <div id="result-area" class="result-area" hidden>
            <h2>Result</h2>
            <div class="result-preview">
                <img id="result-gif" class="result-gif">
            </div>
            <div class="result-actions">
                <button id="download-btn" class="btn btn-success">Download GIF</button>
                <button id="reset-btn" class="btn btn-secondary">Try Another Photo</button>
            </div>
        </div>

        <canvas id="work-canvas" hidden></canvas>
    </div>

    <script src="app.js"></script>
</body>
</html>
